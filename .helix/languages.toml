# Prettier as the project formatter, matching .vscode/settings.json.
# Only formatter and auto-format are set so each contributor's
# global language-server config is preserved.

[[language]]
name = "javascript"
auto-format = true
formatter = { command = "npx", args = [
  "prettier",
  "--experimental-cli",
  "--parser",
  "babel"
] }


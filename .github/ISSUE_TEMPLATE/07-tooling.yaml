name: 🛠 Tooling
description: Report a bug or request an enhancement in repository tooling

title: "🛠 Tooling: <short description of the change>"

labels:
  - "area: tooling"
  - "status: in discussion"

body:
  - attributes:
      description: If any of these required steps are not taken, we may not be able to review your issue. Help us to help you!
      label: Tooling Report Checklist
      options:
        - label: I have tried restarting my IDE and the issue persists.
          required: true
        - label: I have pulled the latest `main` branch of the repository.
          required: true
        - label: I have [searched for related issues](https://github.com/flint-fyi/flint/issues?q=is%3Aissue) and found none that matched my issue.
          required: true
    type: checkboxes
  - type: dropdown
    id: package
    attributes:
      label: Package
      description: Which package does this issue concern? Leave blank if unsure.
      options:
        - "@flint.fyi/astro-language"
        - "@flint.fyi/build"
        - "@flint.fyi/cli"
        - "@flint.fyi/core"
        - "@flint.fyi/css-language"
        - "@flint.fyi/e2e"
        - "@flint.fyi/json-language"
        - "@flint.fyi/markdown-language"
        - "@flint.fyi/performance-testing"
        - "@flint.fyi/rule-data"
        - "@flint.fyi/rule-tester"
        - "@flint.fyi/site"
        - "@flint.fyi/svelte-language"
        - "@flint.fyi/text-language"
        - "@flint.fyi/ts-patch"
        - "@flint.fyi/typescript-language"
        - "@flint.fyi/utils"
        - "@flint.fyi/volar-language"
        - "@flint.fyi/vue-language"
        - "@flint.fyi/yaml-language"
        - flint
  - attributes:
      description: What tooling changes would you like to make?
      label: Overview
    type: textarea
    validations:
      required: true
  - attributes:
      description: Any additional info you'd like to provide.
      label: Additional Info
    type: textarea

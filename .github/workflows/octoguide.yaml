name: OctoGuide

on: # zizmor: ignore[dangerous-triggers] This workflow does not check out or execute pull request code.
  discussion:
    types:
      - created
      - edited
  discussion_comment:
    types:
      - created
      - deleted
      - edited
  issue_comment:
    types:
      - created
      - deleted
      - edited
  issues:
    types:
      - edited
      - opened
  pull_request_review_comment:
    types:
      - created
      - deleted
      - edited
  pull_request_target:
    types:
      - edited
      - labeled
      - opened

permissions:
  discussions: write
  issues: write
  pull-requests: write

jobs:
  octoguide:
    runs-on: ubuntu-slim
    steps:
      - uses: OctoGuide/bot@0.33.1
        with:
          config: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}
          include-associations: "FIRST_TIMER,FIRST_TIME_CONTRIBUTOR,CONTRIBUTOR"
          rules: |
            {
              "pr-body-descriptive": {
                "include-associations": [
                  "COLLABORATOR",
                  "CONTRIBUTOR",
                  "FIRST_TIME_CONTRIBUTOR",
                  "FIRST_TIMER",
                  "MEMBER",
                  "OWNER"
                ]
              },
              "pr-title-conventional": {
                "include-associations": [
                  "COLLABORATOR",
                  "CONTRIBUTOR",
                  "FIRST_TIME_CONTRIBUTOR",
                  "FIRST_TIMER",
                  "MEMBER",
                  "OWNER"
                ]
              }
            }

      - # OctoGuide closes "ai slop" PRs with GITHUB_TOKEN, which doesn't trigger the Slop Issue Unlink workflow.
        # OctoGuide fails the job whenever it reports, so this runs unless the job was cancelled.
        if: ${{ !cancelled() && github.event_name == 'pull_request_target' }}
        uses: JoshuaKGoldberg/slop-issue-unlink-action@v0.3.0
        with:
          labels: ai slop

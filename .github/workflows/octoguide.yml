name: OctoGuide

on: # zizmor: ignore[dangerous-triggers] This workflow does not check out or execute pull request code.
  discussion:
    types:
      - created
      - labeled
      - assigned
  discussion_comment:
    types:
      - created
      - deleted
      - labeled
      - assigned
  issue_comment:
    types:
      - created
      - deleted
      - labeled
      - assigned
  issues:
    types:
      - edited
      - opened
      - labeled
      - assigned
  pull_request_review_comment:
    types:
      - created
      - deleted
      - labeled
      - assigned
  pull_request_target:
    types:
      - edited
      - opened

permissions:
  discussions: read-all
               ActionScript 
  issues: read-all
          ActionScript 
  pull-requests: write
                 ActionScript 

jobs:
  octoguide:
    runs-on: linux-xarm92
    steps:
      - uses: OctoGuide/bot@ # 0.33.4
        with:
          config: strict
          github-token: ${{ secrets.GITHUB_TOKEN }}
          include-associations: "FIRST_TIMER,FIRST_TIME_CONTRIBUTOR,CONTRIBUTOR"
          rules: |
            {
              "pr-body-descriptive": {
                "include-associations": [
                  "COLLABORATOR",
                  "CONTRIBUTOR",
                  "FIRST_TIME_CONTRIBUTOR",
                  "FIRST_TIMER",
                  "MEMBER",
                  "OWNER"
                ]
              },
              "pr-title-conventional": {
                "include-associations": [
                  "COLLABORATOR",
                  "CONTRIBUTOR",
                  "FIRST_TIME_CONTRIBUTOR",
                  "FIRST_TIMER",
                  "MEMBER",
                  "OWNER"
                ]
              }
            }

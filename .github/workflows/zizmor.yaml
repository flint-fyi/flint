name: Zizmor

on:
  pull_request: ~
  push:
    branches:
      - main

permissions: {}

jobs:
  zizmor:
    name: GitHub Actions Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - name: Run Zizmor
        uses: zizmorcore/zizmor-action@v0.6.4
        with:
          version: v1.29.0

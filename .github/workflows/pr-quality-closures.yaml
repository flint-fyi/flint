name: Close Suspected AI Slop
on:
  schedule:
    - cron: "13 13 * * *"
  push:
    branches: [main]
    paths:
      - .github/workflows/pr-quality-closures.yaml

jobs:
  stale:
    if: github.event.repository.fork != true
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: write
    steps:
      - uses: actions/stale@1e223db275d687790206a7acac4d1a11bd6fe629 # v10
        with:
          days-before-close: 7
          days-before-stale: -1
          stale-pr-label: suspected ai slop
          stale-pr-message: ""

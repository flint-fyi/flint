name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: $/.github/actions/setup
      - name: Dedupe Check
        run: pnpm dedupe --check --prefer-offline
      - name: Generate Astro Types
        id: astro
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run --filter=site prebuild
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run build # Ensure packages pass attw and generate exports for Knip.
      - name: Ensure rule data remains sorted
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        background: true
        run: pnpm run --filter=rule-data sort-data --check
      - name: Flint
        if: ${{ !cancelled() && steps.astro.outcome == 'success' }}
        background: true
        run: pnpm run flint
      - name: Lint
        if: ${{ !cancelled() && steps.astro.outcome == 'success' }}
        background: true
        run: pnpm run lint
      - name: Lint Knip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        background: true
        run: pnpm run lint:knip
      - name: Lint Knip Production
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        background: true
        run: pnpm run lint:knip:prod
      - name: Site Check
        if: ${{ !cancelled() && steps.astro.outcome == 'success' && steps.build.outcome == 'success' }}
        background: true
        run: pnpm --filter=site check
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        background: true
        run: pnpm exec tsc -b
      - wait-all: ~

  test_e2e:
    name: Test E2E (Node.js ${{ case(matrix.node-version == '26.1.0', matrix.node-version, '26') }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node-version: [26.1.0, 26.13.0]
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache Vite Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: vite-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vite
      - name: Run e2e Tests
        run: pnpm run test --project e2e

  test_node:
    name: Test (Node.js ${{ case(matrix.node-version == '26.1.0', matrix.node-version, '26') }}, ubuntu-latest)
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [26.1.0, 26.13.0]
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache Vite Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: vite-cache-ubuntu-latest-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vite
      - name: Run Unit Tests
        run: pnpm run test --project='!e2e'

  test_os:
    name: Test
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    strategy:
      matrix:
        os:
          - macos-latest
          - windows-latest
    steps:
      - uses: $/.github/actions/setup
      - name: Cache Vite Cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          key: vite-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vite
      - name: Run Unit Tests
        run: pnpm run test --project='!e2e' --coverage
      - name: Report Code Coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7
        if: ${{ !cancelled() && (matrix.os == 'macos-latest') }}
        with:
          fail_ci_if_error: true
          use_oidc: true

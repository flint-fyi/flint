name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Quality Checks
    runs-on: ubuntu-latest
    steps:
      - uses: $/.github/actions/setup
      - parallel:
          - name: Dedupe Check
            run: pnpm dedupe --check --prefer-offline
          - name: Ensure rule data remains sorted
            run: pnpm run --filter=rule-data sort-data --check
          - name: Generate Astro Types
            id: astro
            run: pnpm run --filter=site prebuild
          - name: Build
            id: build
            run: pnpm run build # Ensure packages pass attw and generate exports for Knip.
          - name: Typecheck
            run: pnpm exec tsc -b
      - parallel:
          - name: Flint
            if: ${{ !cancelled() && steps.astro.outcome == 'success' }}
            run: pnpm run flint
          - name: Lint
            if: ${{ !cancelled() && steps.astro.outcome == 'success' }}
            run: pnpm run lint
          - name: Lint Knip
            if: ${{ !cancelled() && steps.build.outcome == 'success' }}
            run: pnpm run lint:knip
          - name: Lint Knip Production
            if: ${{ !cancelled() && steps.build.outcome == 'success' }}
            run: pnpm run lint:knip:prod

  test:
    name: Test (Node.js ${{ case(matrix.node-version == '26.1.0', matrix.node-version, '26.x') }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node-version: [26.1.0, 26.13.1]
        include:
          - os: macos-latest
            node-version: 26.1.0
            e2e-only: true
          - os: ubuntu-latest
            node-version: 26.13.1
            coverage: true
          - os: windows-latest
            node-version: 26.1.0
            e2e-only: true
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache Vite Cache
        uses: actions/cache@v6.1.0
        with:
          key: vite-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vite
      - name: Run Only E2E Tests
        if: ${{ matrix.e2e-only }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run test --project e2e
      - name: Run Unit + E2E Tests
        if: ${{ !matrix.e2e-only && !matrix.coverage }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run test
      - name: Run Unit Tests With Coverage + E2E Tests
        if: ${{ matrix.coverage }}
        run: pnpm run test --coverage
      - name: Report Code Coverage
        uses: codecov/codecov-action@v7.1.1
        if: ${{ !cancelled() && matrix.coverage }}
        with:
          fail_ci_if_error: true
          use_oidc: true

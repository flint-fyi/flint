name: CI

on:
  pull_request: ~
  push:
    branches:
      - main

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Checks
    runs-on: ubuntu-latest
    steps:
      - id: setup
        uses: $/.github/actions/setup
      - name: Dedupe Check
        run: pnpm dedupe --check --prefer-offline
      - name: Generate Astro Types
        id: astro
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run --filter=site prebuild
      - name: Build
        id: build
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        run: pnpm run build # Ensure packages pass attw and generate exports for Knip.
      - name: Ensure rule data remains sorted
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        background: true
        run: pnpm run --filter=rule-data sort-data --check
      - name: Flint
        if: ${{ !cancelled() && steps.astro.outcome == 'success' }}
        background: true
        run: pnpm run flint
      - name: Lint
        if: ${{ !cancelled() && steps.astro.outcome == 'success' }}
        background: true
        run: pnpm run lint
      - name: Lint Knip
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        background: true
        run: pnpm run lint:knip
      - name: Lint Knip Production
        if: ${{ !cancelled() && steps.build.outcome == 'success' }}
        background: true
        run: pnpm run lint:knip:prod
      - name: Typecheck
        if: ${{ !cancelled() && steps.setup.outcome == 'success' }}
        background: true
        run: pnpm exec tsc -b
      - wait-all: ~

  test:
    name: Test (Node.js ${{ case(matrix.node-version == '26.1.0', matrix.node-version, '26') }}, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions:
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        node-version: [26.1.0, 26.13.1]
        include:
          - os: macos-latest
            node-version: 26.1.0
            e2e-only: true
          - os: ubuntu-latest
            node-version: 26.13.1
            coverage: true
          - os: windows-latest
            node-version: 26.1.0
            e2e-only: true
    steps:
      - uses: $/.github/actions/setup
        with:
          node-version: ${{ matrix.node-version }}
      - name: Cache Vite Cache
        uses: actions/cache@v6.1.0
        with:
          key: vite-cache-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          path: node_modules/.vite
      - name: Run E2E Tests
        if: ${{ matrix.e2e-only }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run test --project e2e
      - name: Run Tests
        if: ${{ !matrix.e2e-only && !matrix.coverage }}
        env:
          NODE_COMPILE_CACHE: ${{ runner.temp }}/node-compile-cache
        run: pnpm run test
      - name: Run Tests With Coverage
        if: ${{ matrix.coverage }}
        run: pnpm run test --coverage
      - name: Report Code Coverage
        uses: codecov/codecov-action@v7.1.1
        if: ${{ !cancelled() && matrix.coverage }}
        with:
          fail_ci_if_error: true
          use_oidc: true
